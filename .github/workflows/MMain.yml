name: Web App CI

on:
  push:
    branches: [ Main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run HTML check
        run: |
          echo "Checking HTML files"
          ls *.html || exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: index.html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
